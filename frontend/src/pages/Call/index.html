<div id="pg-call" class="page">
  <div class="stars-layer" id="sl-call"></div>

  <!-- Header -->
  <div class="call-header">
    <button class="btn-end-top" onclick="go('friends')">✕ 終了</button>
    <div class="timer">07:23</div>
    <div class="caption-btn">字幕 ON</div>
  </div>

  <!-- Live 2D -->
  <div class="live2d-wrap">
    <div class="live2d-frame">
      <div class="live2d-grid"></div>
      <div class="live2d-badge">✦ Live 2D</div>
      <div class="char-big">🌸</div>
    </div>
  </div>

  <!-- Call status -->
  <div class="call-status">
    <div class="call-name">✦ Yuki と通話中 ✦</div>
    <div class="call-mood">😊 楽しい気分 · Happy mood</div>
  </div>

  <!-- Wave visualizer -->
  <div class="wave-viz" id="wave-viz">
    <div class="wbar" style="height:18px;"></div>
    <div class="wbar" style="height:32px;"></div>
    <div class="wbar" style="height:24px;"></div>
    <div class="wbar" style="height:40px;"></div>
    <div class="wbar" style="height:28px;"></div>
    <div class="wbar" style="height:44px;"></div>
    <div class="wbar" style="height:34px;"></div>
    <div class="wbar" style="height:38px;"></div>
    <div class="wbar" style="height:20px;"></div>
  </div>

  <!-- Dialogue bubble -->
  <div class="dialogue">
    <div class="dlg-jp">
      ねえ、<span class="word-link" title="週末 = weekend">週末</span>は何してたの？
      <span class="word-link" title="映画 = movie">映画</span>とか見た？
    </div>
    <div class="dlg-en">"Hey, what did you do this weekend? Did you watch any movies?"</div>
  </div>

  <!-- Controls -->
  <div class="call-controls">
    <div class="ctrl">
      <div class="ctrl-circle">🔇</div>
      <div class="ctrl-lbl">ミュート</div>
    </div>
    <div class="ctrl">
      <div class="ctrl-circle main-mic">🎤</div>
      <div class="ctrl-lbl">話す</div>
    </div>
    <div class="ctrl">
      <div class="ctrl-circle">💬</div>
      <div class="ctrl-lbl">字幕</div>
    </div>
    <div class="ctrl" onclick="go('summary')">
      <div class="ctrl-circle end-call">📵</div>
      <div class="ctrl-lbl">終了</div>
    </div>
  </div>
</div>
